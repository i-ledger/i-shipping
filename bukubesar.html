<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rekap Pengiriman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">Rekap Pengiriman Hari Ini</h1>

    <div class="grid md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block mb-1 font-semibold">Filter Nama PT</label>
        <select id="filterPT" class="w-full border p-3 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Filter Pangkalan</label>
        <select id="filterPangkalan" class="w-full border p-3 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full table-auto border border-gray-300 text-sm" id="rekapTable">
        <thead class="bg-indigo-600 text-white">
          <tr>
            <th class="px-4 py-2">Timestamp</th>
            <th class="px-4 py-2">Driver/Kernet</th>
            <th class="px-4 py-2">Nama Pangkalan</th>
            <th class="px-4 py-2">Nama PT</th>
            <th class="px-4 py-2">Jumlah Pengiriman(3Kg)</th>
            <th class="px-4 py-2">Foto Pangkalan</th>
            <th class="px-4 py-2">Pemilik sedang dilokasi</th>
            <th class="px-4 py-2">Pemilik Pangkalan</th>
            <th class="px-4 py-2">Bright Gas (12Kg|5,5Kg)</th>
            <th class="px-4 py-2">Retur</th>
            <th class="px-4 py-2">Bukti Retur</th>
            <th class="px-4 py-2">Lokasi</th>
          </tr>
        </thead>
        <tbody id="rekapBody"></tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL   = API_ENDPOINT + '?action=transaksi';
    const filterPT  = document.getElementById('filterPT');
    const filterPgl = document.getElementById('filterPangkalan');
    const bodyEl    = document.getElementById('rekapBody');
    let allData     = [];

    function extractFileId(url) {
      const m = url.match(/\/d\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function renderThumb(url) {
      const id = extractFileId(url);
      if (!id) return '-';
      // sz parameter = max width (320px); img height auto
      const thumb = `https://drive.google.com/thumbnail?authuser=0&sz=w320&id=${id}`;
      // clickable to open full view
      return `<a href="${url}" target="_blank">
                <img src="${thumb}" class="h-20 rounded shadow mx-auto" loading="lazy"/>
              </a>`;
    }

    function renderRow(r) {
      return `
        <tr class="border-b hover:bg-gray-50">
          <td class="px-4 py-2">${r.timestamp || '-'}</td>
          <td class="px-4 py-2">${r.nama      || '-'}</td>
          <td class="px-4 py-2">${r.uraian    || '-'}</td>
          <td class="px-4 py-2">${r.pos       || '-'}</td>
          <td class="px-4 py-2 text-center">${r.nominal|| '0'}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.foto)}</td>
          <td class="px-4 py-2">${r.pembayaran|| '-'}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.buktitransfer)}</td>
          <td class="px-4 py-2 text-center">${r.brightgas|| '0'}</td>
          <td class="px-4 py-2 text-center">${r.retur    || '0'}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.buktiretur)}</td>
          <td class="px-4 py-2 text-center">
            ${r.lokasi ? `<a href="${r.lokasi}" target="_blank" class="text-blue-600 underline">Lihat</a>` : '-'}
          </td>
        </tr>`;
    }

    function renderTable(data) {
      const filtered = data.filter(d =>
        (!filterPT.value  || d.pos    === filterPT.value) &&
        (!filterPgl.value || d.uraian === filterPgl.value)
      );
      bodyEl.innerHTML = filtered.map(renderRow).join('');
    }

    async function fetchData() {
      const d = new Date();
      const t= `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const res = await fetch(`${API_URL}&start=${t}&end=${t}`);
      const data= await res.json();
      if (!Array.isArray(data)) return;
      allData = data;
      // populate filters
      const pts = [...new Set(data.map(d=>d.pos))].sort();
      const pgl = [...new Set(data.map(d=>d.uraian))].sort();
      filterPT.innerHTML  = '<option value="">Semua</option>' + pts.map(p=>`<option>${p}</option>`).join('');
      filterPgl.innerHTML = '<option value="">Semua</option>' + pgl.map(p=>`<option>${p}</option>`).join('');
      renderTable(data);
    }

    filterPT.addEventListener('change', ()=>renderTable(allData));
    filterPgl.addEventListener('change', ()=>renderTable(allData));
    fetchData();
  </script>
</body>
</html>
