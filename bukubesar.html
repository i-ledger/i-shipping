<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rekap Pengiriman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">Rekap Pengiriman Hari Ini</h1>

    <div class="grid md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block mb-1 font-semibold">Filter Nama PT</label>
        <select id="filterPT" class="w-full border p-3 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Filter Pangkalan</label>
        <select id="filterPangkalan" class="w-full border p-3 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full table-auto border border-gray-300 text-sm" id="rekapTable">
        <thead class="bg-indigo-600 text-white">
          <tr>
            <th class="px-4 py-2">Waktu</th>
            <th class="px-4 py-2">Driver</th>
            <th class="px-4 py-2">Pangkalan</th>
            <th class="px-4 py-2">Nama PT</th>
            <th class="px-4 py-2">Jumlah</th>
            <th class="px-4 py-2">Bright Gas</th>
            <th class="px-4 py-2">Retur</th>
            <th class="px-4 py-2">Status</th>
            <th class="px-4 py-2">Link Bukti</th>
            <th class="px-4 py-2">Lokasi</th>
          </tr>
        </thead>
        <tbody id="rekapBody"></tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL = API_ENDPOINT + '?action=transaksi';

    const filterPT = document.getElementById('filterPT');
    const filterPangkalan = document.getElementById('filterPangkalan');
    const rekapBody = document.getElementById('rekapBody');

    let allData = [];

    async function fetchData() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hariIni = `${yyyy}-${mm}-${dd}`;

      const res = await fetch(`${API_URL}&start=${hariIni}&end=${hariIni}`);
      const data = await res.json();

      if (!data || !Array.isArray(data)) return;

      allData = data;

      const uniquePT = [...new Set(data.map(d => d.pos))].sort();
      const uniquePangkalan = [...new Set(data.map(d => d.uraian))].sort();

      filterPT.innerHTML = '<option value="">Semua</option>' + uniquePT.map(p => `<option>${p}</option>`).join('');
      filterPangkalan.innerHTML = '<option value="">Semua</option>' + uniquePangkalan.map(p => `<option>${p}</option>`).join('');

      renderTable(data);
    }

    function renderTable(rows) {
      const filtered = rows.filter(item => {
        return (!filterPT.value || item.pos === filterPT.value) &&
               (!filterPangkalan.value || item.uraian === filterPangkalan.value);
      });

      rekapBody.innerHTML = filtered.map(r => `
        <tr class="border-b">
          <td class="px-4 py-2">${r.timestamp || '-'}</td>
          <td class="px-4 py-2">${r.nama || '-'}</td>
          <td class="px-4 py-2">${r.uraian || '-'}</td>
          <td class="px-4 py-2">${r.pos || '-'}</td>
          <td class="px-4 py-2">${r.nominal || '-'}</td>
          <td class="px-4 py-2">${r.brightgas || '0'}</td>
          <td class="px-4 py-2">${r.retur || '0'}</td>
          <td class="px-4 py-2">${r.pembayaran || '-'}</td>
          <td class="px-4 py-2 space-y-1 space-x-1">
            ${r.foto ? `<a href="${r.foto}" target="_blank" class="text-blue-600 underline">Nota</a>` : ''}
            ${r.buktitransfer ? `<a href="${r.buktitransfer}" target="_blank" class="text-blue-600 underline">Transfer</a>` : ''}
            ${r.buktiretur ? `<a href="${r.buktiretur}" target="_blank" class="text-blue-600 underline">Retur</a>` : ''}
          </td>
          <td class="px-4 py-2">
            ${r.lokasi ? `<a href="${r.lokasi}" target="_blank" class="text-blue-600 underline">Lihat</a>` : '-'}
          </td>
        </tr>
      `).join('');
    }

    filterPT.addEventListener('change', () => renderTable(allData));
    filterPangkalan.addEventListener('change', () => renderTable(allData));

    fetchData();
  </script>
</body>
</html>
