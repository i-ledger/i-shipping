<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>i-Shipping SES_GS</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<style>

.spinner{
border:4px solid rgba(99,102,241,0.2);
border-top-color:#6366f1;
border-radius:50%;
width:48px;
height:48px;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

canvas{display:none;}

#loadingOverlay{
backdrop-filter:blur(3px);
background-color:rgba(0,0,0,0.4);
}

</style>
</head>


<body class="bg-gradient-to-br from-indigo-100 to-white min-h-screen flex items-center justify-center p-6 relative font-sans">

<!-- Loading -->
<div id="loadingOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center">
<div class="spinner"></div>
</div>


<!-- Popup -->
<div id="popupNotif"
class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 
bg-white rounded-3xl shadow-2xl p-8 max-w-sm text-center
opacity-0 pointer-events-none transition-opacity duration-300 z-60">

<h3 class="text-xl font-semibold text-gray-900 mb-2">
Barang sudah terkirim
</h3>

<p class="text-gray-600 mb-6">
Terimakasih
</p>

<button id="closePopupBtn"
class="bg-indigo-600 text-white rounded-full px-6 py-2">
Tutup
</button>

</div>


<!-- Dashboard -->
<a href="dashboard.html"
class="absolute top-6 right-6 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-lg">

Ke Dashboard

</a>



<div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-10">

<h2 class="text-4xl font-extrabold text-indigo-700 mb-8 text-center">

i-Shipping SES_GS

</h2>


<form id="ledgerForm" class="space-y-8">


<div>
<label class="block text-sm font-medium text-gray-700 mb-2">
Driver/Kernet
</label>

<select id="nama"
required
class="mt-1 block w-full border border-gray-300 rounded-xl p-4 text-lg">
</select>
</div>


<div>
<label class="block text-sm font-medium text-gray-700 mb-2">
Nama Pangkalan
</label>

<input list="uraianList"
id="uraian"
required
class="mt-1 block w-full border border-gray-300 rounded-xl p-4 text-lg"/>

<datalist id="uraianList"></datalist>

</div>



<div>
<label class="block text-sm font-medium text-gray-700 mb-2">
Nama PT
</label>

<input type="text"
id="pos"
readonly
class="mt-1 block w-full bg-gray-100 border border-gray-300 rounded-xl p-4 text-lg"/>
</div>


<div>
<label class="block text-sm font-medium text-gray-700 mb-2">
Jumlah Pengiriman LPG 3Kg
</label>

<input type="text"
id="nominal"
required
class="mt-1 block w-full border border-gray-300 rounded-xl p-4 text-lg"/>
</div>



<button type="submit"
class="w-full bg-indigo-700 text-white font-bold py-4 rounded-3xl">

Submit

</button>

</form>

</div>



<script src="config.js"></script>
<script src="kamera-kanvas.js"></script>


<script>

if(localStorage.getItem('loggedIn')!=='true'){
window.location.href='login.html';
}


/* =========================
SERVICE WORKER REGISTER
========================= */

if('serviceWorker' in navigator){

navigator.serviceWorker.register('sw.js')
.then(()=>{

console.log("Service Worker aktif");

Notification.requestPermission();

})

.catch(err=>console.log(err));

}


/* =========================
API CONFIG
========================= */

const API_NAMA = API_ENDPOINT + '?action=nama';
const API_POS = API_ENDPOINT + '?action=pos';
const SUBMIT_URL = API_ENDPOINT;


const namaEl=document.getElementById('nama');
const uraianEl=document.getElementById('uraian');
const posEl=document.getElementById('pos');
const nominalEl=document.getElementById('nominal');


fetch(API_NAMA)
.then(r=>r.json())
.then(data=>{

data.forEach(n=>{

const o=document.createElement('option');

o.value=o.textContent=n;

namaEl.appendChild(o);

});

});


let uraianMap={};

fetch(API_POS)
.then(r=>r.json())
.then(data=>{

data.forEach(row=>{

uraianMap[row.uraian]=row.pos;

const o=document.createElement('option');

o.value=row.uraian;

document.getElementById('uraianList').appendChild(o);

});

});


uraianEl.addEventListener('input',()=>{

posEl.value=uraianMap[uraianEl.value]||'';

});


nominalEl.addEventListener('input',e=>{

const v=e.target.value.replace(/\D/g,'');

e.target.value=new Intl.NumberFormat('id-ID').format(v);

});


function showPopup(){

const popup=document.getElementById("popupNotif");

popup.classList.remove("opacity-0","pointer-events-none");

setTimeout(()=>{

popup.classList.add("opacity-0","pointer-events-none");

},4000);

}



/* =========================
SUBMIT FORM
========================= */

document.getElementById('ledgerForm')
.addEventListener('submit',async function(e){

e.preventDefault();

const nama=namaEl.value;
const uraian=uraianEl.value;
const pos=posEl.value;
const nominal=nominalEl.value.replace(/\D/g,'');


const payload={

action:'addTransaksi',
sheet:'Transaksi',

payload:{
nama,
uraian,
pos,
nominal,
fotoNota:window.fotoNotaBase64
}

};


try{

const res=await fetch(SUBMIT_URL,{
method:'POST',
headers:{'Content-Type':'text/plain'},
body:JSON.stringify(payload)
});

const result=await res.json();


if(result.status==='success'){

showPopup();


/* =========================
NOTIFICATION TRIGGER
========================= */

if(Notification.permission==="granted"){

navigator.serviceWorker.getRegistration()
.then(reg=>{

reg.showNotification("i-Shipping",{

body:`${nama} kirim ${nominal} LPG`,
icon:"pertamina-logoicon.png",
vibrate:[200,100,200]

});

});

}


this.reset();

posEl.value='';

}

}catch(err){

alert(err.message);

}

});

</script>
