<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buku Besar i-Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="p-4">
    <h1 class="text-2xl font-bold mb-4">📘 Buku Besar</h1>
    <table class="w-full border bg-white rounded-lg overflow-hidden">
      <thead class="bg-gray-200">
        <tr>
          <th class="px-2 py-1">#</th>
          <th class="px-2 py-1">Tanggal</th>
          <th class="px-2 py-1">POS</th>
          <th class="px-2 py-1">Nama</th>
          <th class="px-2 py-1">Uraian</th>
          <th class="px-2 py-1">Nominal</th>
          <th class="px-2 py-1">Retur</th>
          <th class="px-2 py-1">BrightGas</th>
          <th class="px-2 py-1">Pembayaran</th>
          <th class="px-2 py-1">Foto Nota</th>
          <th class="px-2 py-1">Bukti</th>
          <th class="px-2 py-1">Bukti Retur</th>
          <th class="px-2 py-1">Lokasi</th>
          <th class="px-2 py-1">Aksi</th>
        </tr>
      </thead>
      <tbody id="dataBody"></tbody>
    </table>
  </div>

  <!-- Modal Edit -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-96">
      <h2 class="text-lg font-bold mb-4">✏️ Edit Transaksi</h2>
      <form id="editForm" class="space-y-2">
        <input type="hidden" id="editRow">
        <label class="block">Tanggal
          <input type="datetime-local" id="editTimestamp" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">POS
          <input type="text" id="editPT" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Nama
          <input type="text" id="editNama" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Uraian
          <input type="text" id="editUraian" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Nominal
          <input type="number" id="editNominal" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Retur
          <input type="number" id="editRetur" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Bright Gas
          <input type="number" id="editBrightGas" class="border rounded w-full px-2 py-1">
        </label>
        <label class="block">Pembayaran
          <input type="text" id="editPembayaran" class="border rounded w-full px-2 py-1">
        </label>
        <div class="flex justify-end space-x-2 pt-3">
          <button type="button" class="px-3 py-1 bg-gray-400 text-white rounded" onclick="closeEdit()">Batal</button>
          <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded">Simpan</button>
        </div>
      </form>
    </div>
  </div>

<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwqzD5nZkTrExGUjdACTyELqeEYhWNvayryYunToK-jLB9EjLehJSDjLGVrbLPhRFhi/exec"; // ganti dengan URL Apps Script kamu
let allData = [];

function formatDate(ts) {
  if (!ts) return "-";
  return new Date(ts).toLocaleString("id-ID");
}
function renderThumb(url) {
  return url ? `<a href="${url}" target="_blank"><img src="${url}" class="h-10 mx-auto"/></a>` : "-";
}

function renderRow(r, index) {
  return `
    <tr class="border-b hover:bg-gray-50">
      <td class="px-2 py-1 text-center">${index + 1}</td>
      <td class="px-2 py-1">${formatDate(r.timestamp)}</td>
      <td class="px-2 py-1">${r.pos || "-"}</td>
      <td class="px-2 py-1">${r.nama || "-"}</td>
      <td class="px-2 py-1">${r.uraian || "-"}</td>
      <td class="px-2 py-1 text-right">${r.nominal || 0}</td>
      <td class="px-2 py-1 text-center">${r.retur || 0}</td>
      <td class="px-2 py-1 text-center">${r.brightgas || 0}</td>
      <td class="px-2 py-1">${r.pembayaran || "-"}</td>
      <td class="px-2 py-1 text-center">${renderThumb(r.foto)}</td>
      <td class="px-2 py-1 text-center">${renderThumb(r.bukti)}</td>
      <td class="px-2 py-1 text-center">${renderThumb(r.buktiretur)}</td>
      <td class="px-2 py-1 text-center">${r.lokasi ? `<a href="${r.lokasi}" target="_blank" class="text-blue-600 underline">Lihat</a>` : "-"}</td>
      <td class="px-2 py-1 text-center">
        <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-2 py-1 rounded" onclick="openEdit(${r.row})">Edit</button>
      </td>
    </tr>`;
}

async function fetchData() {
  const res = await fetch(API_ENDPOINT + "?action=transaksi&sheet=Transaksi");
  const data = await res.json();
  allData = data; // simpan semua data
  dataBody.innerHTML = data.map((r,i) => renderRow(r,i)).join("");
}

function openEdit(row) {
  const r = allData.find(d => d.row == row);
  if (!r) return alert("Data tidak ditemukan");

  editRow.value = r.row;
  editTimestamp.value = r.timestamp ? new Date(r.timestamp).toISOString().slice(0,16) : "";
  editPT.value = r.pos || "";
  editNama.value = r.nama || "";
  editUraian.value = r.uraian || "";
  editNominal.value = r.nominal || 0;
  editRetur.value = r.retur || 0;
  editBrightGas.value = r.brightgas || 0;
  editPembayaran.value = r.pembayaran || "";
  editModal.classList.remove("hidden");
}
function closeEdit() { editModal.classList.add("hidden"); }

editForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    action: "updateTransaksi",
    sheet: "Transaksi",
    payload: {
      row: editRow.value,
      timestamp: editTimestamp.value,
      pos: editPT.value,
      nama: editNama.value,
      uraian: editUraian.value,
      nominal: editNominal.value,
      retur: editRetur.value,
      brightgas: editBrightGas.value,
      pembayaran: editPembayaran.value
    }
  };

  const res = await fetch(API_ENDPOINT, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  const result = await res.json();
  if (result.status === "success") {
    alert("Data berhasil diperbarui!");
    closeEdit();
    fetchData();
  } else {
    alert("Gagal update: " + result.message);
  }
});

fetchData();
</script>

</body>
</html>
