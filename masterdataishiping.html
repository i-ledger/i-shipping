<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Besar - iLedger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="config.js"></script> <!-- ambil API_ENDPOINT dari config.js -->
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-3">📒 Buku Besar</h2>

    <!-- Filter -->
    <div class="row mb-3 g-2">
      <div class="col-md-3">
        <input type="date" id="startDate" class="form-control">
      </div>
      <div class="col-md-3">
        <input type="date" id="endDate" class="form-control">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="loadData()">Filter</button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered" id="tableData">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Uraian</th>
            <th>Pos</th>
            <th>Nominal</th>
            <th>Pembayaran</th>
            <th>Foto Nota</th>
            <th>Bukti Transfer</th>
            <th>Retur</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Edit -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Edit Transaksi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editRow">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Tanggal</label>
                <input type="datetime-local" id="editTanggal" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Nama</label>
                <input type="text" id="editNama" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Uraian</label>
                <input type="text" id="editUraian" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Pos</label>
                <input type="text" id="editPos" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Nominal</label>
                <input type="number" id="editNominal" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Pembayaran</label>
                <input type="text" id="editPembayaran" class="form-control">
              </div>
              <div class="col-md-12">
                <label class="form-label">Retur</label>
                <input type="number" id="editRetur" class="form-control">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-success" onclick="saveEdit()">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = window.API_ENDPOINT;
    let allData = [];
    let editModal;

    document.addEventListener("DOMContentLoaded", () => {
      editModal = new bootstrap.Modal(document.getElementById('editModal'));
      loadData();
    });

    async function loadData() {
      const start = document.getElementById("startDate").value;
      const end = document.getElementById("endDate").value;
      const url = `${API}?action=transaksi&sheet=Transaksi${start ? `&start=${start}` : ''}${end ? `&end=${end}` : ''}`;

      const res = await fetch(url);
      const data = await res.json();
      allData = data;
      renderTable();
    }

    function renderTable() {
      const tbody = document.querySelector("#tableData tbody");
      tbody.innerHTML = "";
      allData.forEach((row, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${row.tanggal || ""}</td>
            <td>${row.nama || ""}</td>
            <td>${row.uraian || ""}</td>
            <td>${row.pos || ""}</td>
            <td>${row.nominal || ""}</td>
            <td>${row.pembayaran || ""}</td>
            <td>${row.fotonota ? `<img src="${row.fotonota}" width="50">` : "-"}</td>
            <td>${row.fotobukti ? `<img src="${row.fotobukti}" width="50">` : "-"}</td>
            <td>${row.retur || 0}</td>
            <td>
              <button class="btn btn-sm btn-warning" onclick="openEdit(${i})">Edit</button>
            </td>
          </tr>
        `;
      });
    }

    function openEdit(index) {
      const row = allData[index];
      document.getElementById("editRow").value = row._row || (index+2); // row index di sheet (header = row1)
      document.getElementById("editTanggal").value = row.tanggal ? formatDateTimeForInput(row.tanggal) : "";
      document.getElementById("editNama").value = row.nama || "";
      document.getElementById("editUraian").value = row.uraian || "";
      document.getElementById("editPos").value = row.pos || "";
      document.getElementById("editNominal").value = row.nominal || "";
      document.getElementById("editPembayaran").value = row.pembayaran || "";
      document.getElementById("editRetur").value = row.retur || 0;
      editModal.show();
    }

    async function saveEdit() {
      const row = document.getElementById("editRow").value;
      const values = [
        new Date(document.getElementById("editTanggal").value),
        document.getElementById("editNama").value,
        document.getElementById("editUraian").value,
        document.getElementById("editPos").value,
        Number(document.getElementById("editNominal").value),
        "", // foto nota (tidak diubah lewat edit)
        document.getElementById("editPembayaran").value,
        "", // foto bukti (tidak diubah lewat edit)
        "", // brightgas
        Number(document.getElementById("editRetur").value),
        "", // retur foto
        ""  // lokasi (tetap lama)
      ];

      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateTransaksi",
          sheet: "Transaksi",
          payload: { row: parseInt(row), values }
        })
      });

      const result = await res.json();
      if (result.status === "success") {
        alert("Data berhasil diperbarui");
        editModal.hide();
        loadData();
      } else {
        alert("Gagal update: " + result.message);
      }
    }

    function formatDateTimeForInput(dateStr) {
      const d = new Date(dateStr);
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  </script>
</body>
</html>
