<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rekap Pengiriman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-6 space-y-4 md:space-y-0">
      <h1 class="text-3xl font-bold text-indigo-700">Rekap Pengiriman</h1>
      <div class="space-x-2">
        <a href="dashboard.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-xl">Dashboard</a>
        <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl">Download Excel</button>
      </div>
    </div>

    <div class="grid md:grid-cols-3 lg:grid-cols-4 gap-4 mb-6">
      <div>
        <label class="block mb-1 font-semibold">Dari Tanggal</label>
        <input type="date" id="fromDate" class="w-full border p-2 rounded-xl" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">Sampai Tanggal</label>
        <input type="date" id="toDate" class="w-full border p-2 rounded-xl" />
      </div>
      <div class="flex items-end">
        <button id="filterDateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl">Filter</button>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Filter Nama PT</label>
        <select id="filterPT" class="w-full border p-2 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Filter Pangkalan</label>
        <select id="filterPangkalan" class="w-full border p-2 rounded-xl">
          <option value="">Semua</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full table-auto border border-gray-300 text-sm" id="rekapTable">
        <thead class="bg-indigo-600 text-white">
          <tr>
            <th class="px-4 py-2">#</th>
            <th class="px-4 py-2">Timestamp</th>
            <th class="px-4 py-2">Nama PT</th>
            <th class="px-4 py-2">Driver/Kernet</th>
            <th class="px-4 py-2">Nama Pangkalan</th>
            <th class="px-4 py-2">Jumlah Pengiriman (3Kg)</th>
            <th class="px-4 py-2">Retur</th>
            <th class="px-4 py-2">Bright Gas</th>
            <th class="px-4 py-2">Pemilik di lokasi</th>
            <th class="px-4 py-2">Foto Pangkalan</th>
            <th class="px-4 py-2">Pemilik Pangkalan</th>
            <th class="px-4 py-2">Bukti Retur</th>
            <th class="px-4 py-2">Lokasi</th>
            <th class="px-4 py-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="rekapBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Edit -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">Edit Data</h2>
      <form id="editForm" class="space-y-3">
        <input type="hidden" id="editRow" />
        <div>
          <label class="block font-semibold">Tanggal & Waktu</label>
          <input type="datetime-local" id="editTimestamp" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Nama PT</label>
          <input type="text" id="editPT" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Driver/Kernet</label>
          <input type="text" id="editNama" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Nama Pangkalan</label>
          <input type="text" id="editUraian" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Jumlah Pengiriman</label>
          <input type="number" id="editNominal" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Retur</label>
          <input type="number" id="editRetur" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Bright Gas</label>
          <input type="number" id="editBrightGas" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Pemilik di lokasi</label>
          <input type="text" id="editPembayaran" class="w-full border p-2 rounded-xl" />
        </div>
        <div>
          <label class="block font-semibold">Lokasi</label>
          <input type="text" id="editLokasi" class="w-full border p-2 rounded-xl" />
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" id="closeModal" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-xl">Batal</button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // NOTE: config.js must define API_ENDPOINT (base Apps Script URL)
    const API_URL = API_ENDPOINT + '?action=transaksi';
    const fromInput = document.getElementById('fromDate');
    const toInput = document.getElementById('toDate');
    const filterBtn = document.getElementById('filterDateBtn');
    const filterPT = document.getElementById('filterPT');
    const filterPangkalan = document.getElementById('filterPangkalan');
    const rekapBody = document.getElementById('rekapBody');
    const downloadBtn = document.getElementById('downloadBtn');

    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const editRowInput = document.getElementById('editRow');
    const editTimestamp = document.getElementById('editTimestamp');
    const editPT = document.getElementById('editPT');
    const editNama = document.getElementById('editNama');
    const editUraian = document.getElementById('editUraian');
    const editNominal = document.getElementById('editNominal');
    const editRetur = document.getElementById('editRetur');
    const editBrightGas = document.getElementById('editBrightGas');
    const editPembayaran = document.getElementById('editPembayaran');
    const editLokasi = document.getElementById('editLokasi');
    const closeModal = document.getElementById('closeModal');

    let allData = [];

    function extractFileId(url) {
      if (!url) return null;
      const directId = url.match(/id=([A-Za-z0-9_-]+)/);
      const fileId = url.match(/\/d\/([A-Za-z0-9_-]+)/);
      return directId ? directId[1] : (fileId ? fileId[1] : null);
    }

    function renderThumb(url) {
      const id = extractFileId(url);
      if (!id) return '-';
      const thumbUrl = `https://drive.google.com/thumbnail?id=${id}&sz=w300`;
      return `<a href="https://drive.google.com/uc?export=view&id=${id}" target="_blank">
                <img src="${thumbUrl}" class="h-20 rounded shadow mx-auto" loading="lazy" />
              </a>`;
    }

    function formatDate(ts) {
      const d = new Date(ts);
      if (isNaN(d)) return '-';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ${hh}:${mi}:${ss}`;
    }

    // renderRow: r = data object, displayIndex = number shown in table, dataIndex = index in allData
    function renderRow(r, displayIndex, dataIndex) {
      return `
        <tr class="border-b hover:bg-gray-50">
          <td class="px-4 py-2 text-center">${displayIndex + 1}</td>
          <td class="px-4 py-2">${formatDate(r.timestamp)}</td>
          <td class="px-4 py-2">${r.pos || '-'}</td>
          <td class="px-4 py-2">${r.nama || '-'}</td>
          <td class="px-4 py-2">${r.uraian || '-'}</td>
          <td class="px-4 py-2 text-center">${r.nominal ?? '0'}</td>
          <td class="px-4 py-2 text-center">${r.retur ?? '0'}</td>
          <td class="px-4 py-2 text-center">${r.brightgas ?? '0'}</td>
          <td class="px-4 py-2">${r.pembayaran || '-'}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.foto)}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.buktitransfer)}</td>
          <td class="px-4 py-2 text-center">${renderThumb(r.buktiretur)}</td>
          <td class="px-4 py-2 text-center">${r.lokasi ? `<a href="${r.lokasi}" target="_blank" class="text-blue-600 underline">Lihat</a>` : '-'}</td>
          <td class="px-4 py-2 text-center">
            <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-2 py-1 rounded-xl" onclick="openEdit(${dataIndex})">Edit</button>
          </td>
        </tr>`;
    }

    // renderTable: build a view array that keeps original indexes
    function renderTable(data) {
      const from = fromInput.value ? new Date(fromInput.value + 'T00:00:00') : null;
      const to = toInput.value ? new Date(toInput.value + 'T23:59:59') : null;

      const view = data
        .map((r, idx) => ({ r, idx }))
        .filter(item => {
          const d = new Date(item.r.timestamp);
          if (isNaN(d)) return false;
          const matchDate = (!from || d >= from) && (!to || d <= to);
          const matchPT = !filterPT.value || item.r.pos === filterPT.value;
          const matchPgl = !filterPangkalan.value || item.r.uraian === filterPangkalan.value;
          return matchDate && matchPT && matchPgl;
        });

      rekapBody.innerHTML = view.map((item, i) => renderRow(item.r, i, item.idx)).join('');
    }

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (!Array.isArray(data)) return;
        allData = data;

        const today = new Date().toISOString().split('T')[0];
        fromInput.value = today;
        toInput.value = today;

        const pts = [...new Set(data.map(d => d.pos))].filter(Boolean).sort();
        const pgls = [...new Set(data.map(d => d.uraian))].filter(Boolean).sort();
        filterPT.innerHTML = '<option value="">Semua</option>' + pts.map(p => `<option>${p}</option>`).join('');
        filterPangkalan.innerHTML = '<option value="">Semua</option>' + pgls.map(p => `<option>${p}</option>`).join('');

        renderTable(allData);
      } catch (err) {
        console.error('fetchData error', err);
      }
    }

    // convert Date -> datetime-local value (local tz)
    function toDatetimeLocalValue(date) {
      const d = new Date(date);
      if (isNaN(d)) return '';
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0,16);
    }

    function openEdit(dataIndex) {
      const r = allData[dataIndex];
      editRowInput.value = dataIndex;
      editTimestamp.value = toDatetimeLocalValue(r.timestamp);
      editPT.value = r.pos || '';
      editNama.value = r.nama || '';
      editUraian.value = r.uraian || '';
      editNominal.value = r.nominal ?? 0;
      editRetur.value = r.retur ?? 0;
      editBrightGas.value = r.brightgas ?? 0;
      editPembayaran.value = r.pembayaran || '';
      editLokasi.value = r.lokasi || '';
      editModal.classList.remove('hidden');
    }

    closeModal.addEventListener('click', () => editModal.classList.add('hidden'));
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') editModal.classList.add('hidden'); });

    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dataIndex = parseInt(editRowInput.value, 10);
      if (isNaN(dataIndex)) return alert('Index data tidak valid');

      const r = allData[dataIndex];

      // Build values array in the SAME ORDER as sheet columns:
      // [ Timestamp, Nama, Uraian, Pos, Nominal, Foto, Pembayaran, Buktitransfer, BrightGas, Retur, Buktiretur, Lokasi ]
      const newTimestampISO = new Date(editTimestamp.value).toISOString();
      const values = [
        newTimestampISO,                       // A: Timestamp
        editNama.value,                        // B: Nama
        editUraian.value,                      // C: Uraian
        editPT.value,                          // D: Pos
        Number(editNominal.value) || 0,        // E: Jumlah Tabung
        r.foto || '',                          // F: Foto Pangkalan (jika tidak ganti)
        editPembayaran.value || '',            // G: Status Pemilik Pangkalan
        r.buktitransfer || '',                 // H: Link Foto Pemilik (tidak diganti di modal)
        Number(editBrightGas.value) || 0,      // I: Bright Gas
        Number(editRetur.value) || 0,          // J: Retur
        r.buktiretur || '',                    // K: Bukti Retur (tidak diganti di modal)
        editLokasi.value || ''                 // L: Lokasi
      ];

      const payload = {
        row: dataIndex + 2, // +2 karena header row ada di 1
        values
      };

      try {
        // POST ke Apps Script sesuai struktur backend 'edit'
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'edit', sheet: 'Transaksi', payload })
        });
        const result = await res.json();

        // backend mengembalikan {status:'success'} atau {status:'error', message:...}
        if (result && result.status === 'success') {
          // update local data & re-render (tetap simpan foto/bukti lama jika tidak diganti)
          allData[dataIndex].timestamp = values[0];
          allData[dataIndex].nama = values[1];
          allData[dataIndex].uraian = values[2];
          allData[dataIndex].pos = values[3];
          allData[dataIndex].nominal = values[4];
          allData[dataIndex].foto = values[5];
          allData[dataIndex].pembayaran = values[6];
          allData[dataIndex].buktitransfer = values[7];
          allData[dataIndex].brightgas = values[8];
          allData[dataIndex].retur = values[9];
          allData[dataIndex].buktiretur = values[10];
          allData[dataIndex].lokasi = values[11];

          renderTable(allData);
          editModal.classList.add('hidden');
          alert('Data berhasil diperbarui!');
        } else {
          console.error('update failed', result);
          alert('Gagal update data: ' + (result && result.message ? result.message : 'unknown'));
        }
      } catch (err) {
        console.error('submit edit error', err);
        alert('Terjadi error saat update');
      }
    });

    filterBtn.addEventListener('click', () => renderTable(allData));
    filterPT.addEventListener('change', () => renderTable(allData));
    filterPangkalan.addEventListener('change', () => renderTable(allData));

    downloadBtn.addEventListener('click', () => {
      // buat CSV berdasar tampilan (filtered)
      const from = fromInput.value ? new Date(fromInput.value + 'T00:00:00') : null;
      const to = toInput.value ? new Date(toInput.value + 'T23:59:59') : null;
      const view = allData
        .map((r, idx) => ({ r, idx }))
        .filter(item => {
          const d = new Date(item.r.timestamp);
          if (isNaN(d)) return false;
          const matchDate = (!from || d >= from) && (!to || d <= to);
          const matchPT = !filterPT.value || item.r.pos === filterPT.value;
          const matchPgl = !filterPangkalan.value || item.r.uraian === filterPangkalan.value;
          return matchDate && matchPT && matchPgl;
        });

      let csv = 'Timestamp,Nama PT,Driver/Kernet,Nama Pangkalan,Jumlah Pengiriman,Retur,Bright Gas,Pemilik di lokasi,Foto Pangkalan,Pemilik Pangkalan,Bukti Retur,Lokasi\n';
      view.forEach(item => {
        const r = item.r;
        const row = [
          `"${formatDate(r.timestamp)}"`,
          `"${(r.pos||'').toString().replace(/"/g,'""')}"`,
          `"${(r.nama||'').toString().replace(/"/g,'""')}"`,
          `"${(r.uraian||'').toString().replace(/"/g,'""')}"`,
          `"${r.nominal ?? 0}"`,
          `"${r.retur ?? 0}"`,
          `"${r.brightgas ?? 0}"`,
          `"${(r.pembayaran||'').toString().replace(/"/g,'""')}"`,
          `"${(r.foto||'').toString().replace(/"/g,'""')}"`,
          `"${(r.buktitransfer||'').toString().replace(/"/g,'""')}"`,
          `"${(r.buktiretur||'').toString().replace(/"/g,'""')}"`,
          `"${(r.lokasi||'').toString().replace(/"/g,'""')}"`
        ];
        csv += row.join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'rekap_pengiriman.csv';
      link.click();
    });

    // init
    fetchData();
  </script>
</body>
</html>
