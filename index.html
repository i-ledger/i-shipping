<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i-Shipping SES_GS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader { border-top-color: #22c55e; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    video, canvas {
      width: 100%;
      height: auto;
      border-radius: 1rem;
      border: 2px solid #22c55e;
      background-color: #f0fdf4;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-white min-h-screen flex items-center justify-center p-4 relative">
  <div id="loadingOverlay" class="hidden absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-16 w-16"></div>
  </div>

  <a href="dashboard.html" class="absolute top-4 right-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">
    Ke Dashboard
  </a>

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-8">
    <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">i-Shipping SES_GS</h2>
    <form id="ledgerForm" class="space-y-6">
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-600">Driver/Kernet</label>
        <select id="nama" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3"></select>
      </div>
      <div>
        <label for="uraian" class="block text-sm font-medium text-gray-600">Nama Pangkalan</label>
        <input list="uraianList" id="uraian" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" />
        <datalist id="uraianList"></datalist>
      </div>
      <div>
        <label for="pos" class="block text-sm font-medium text-gray-600">Nama PT</label>
        <input type="text" id="pos" readonly class="mt-2 block w-full bg-gray-100 border border-gray-300 rounded-lg p-3" />
      </div>
      <div>
        <label for="nominal" class="block text-sm font-medium text-gray-600">Jumlah Pengiriman</label>
        <input type="text" id="nominal" required class="mt-2 block w-full border border-gray-300 rounded-lg p-3" />
      </div>
      <div>
        <label for="brightgas" class="block text-sm font-medium text-gray-600">Tbg Bright Gas</label>
        <input type="number" id="brightgas" required min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
      </div>
      <div>
        <label for="retur" class="block text-sm font-medium text-gray-600">Retur</label>
        <input type="number" id="retur" required min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
      <!-- 🔹 Kamera Pangkalan -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">Kamera Pangkalan</label>
        <video id="videoNota" autoplay muted playsinline class="rounded-xl"></video>
        <canvas id="canvasNota" class="hidden mt-2"></canvas>
        <button type="button" id="captureNota" class="mt-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">Ambil Foto Pangkalan</button>
      </div>

      <!-- 🔹 Kamera Pemilik -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-2">Kamera Pemilik Pangkalan</label>
        <video id="videoBukti" autoplay muted playsinline class="rounded-xl"></video>
        <canvas id="canvasBukti" class="hidden mt-2"></canvas>
        <button type="button" id="captureBukti" class="mt-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">Ambil Foto Pemilik</button>
      </div>

      <!-- 🔹 Kamera Retur -->
      <div id="returFotoContainer" class="hidden">
        <label class="block text-sm font-medium text-gray-600 mb-2">Kamera Retur</label>
        <video id="videoRetur" autoplay muted playsinline class="rounded-xl"></video>
        <canvas id="canvasRetur" class="hidden mt-2"></canvas>
        <button type="button" id="captureRetur" class="mt-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">Ambil Foto Retur</button>
      </div>

      <!-- 🔹 Submit -->
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg">Submit</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    if (localStorage.getItem('loggedIn') !== 'true') window.location.href = 'login.html';

    const videoNota = document.getElementById('videoNota');
    const canvasNota = document.getElementById('canvasNota');
    const captureNota = document.getElementById('captureNota');

    const videoBukti = document.getElementById('videoBukti');
    const canvasBukti = document.getElementById('canvasBukti');
    const captureBukti = document.getElementById('captureBukti');

    const videoRetur = document.getElementById('videoRetur');
    const canvasRetur = document.getElementById('canvasRetur');
    const captureRetur = document.getElementById('captureRetur');

    function startCamera(videoEl) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => videoEl.srcObject = stream)
        .catch(err => alert('Gagal membuka kamera: ' + err));
    }

    function captureImage(videoEl, canvasEl) {
      const context = canvasEl.getContext('2d');
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      context.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
      canvasEl.classList.remove('hidden');
      return canvasEl.toDataURL('image/jpeg').split(',')[1];
    }

    startCamera(videoNota);
    startCamera(videoBukti);
    startCamera(videoRetur);

    let fotoNotaBase64 = "";
    let fotoBuktiBase64 = "";
    let returFotoBase64 = "";

    captureNota.addEventListener('click', () => {
      fotoNotaBase64 = captureImage(videoNota, canvasNota);
    });

    captureBukti.addEventListener('click', () => {
      fotoBuktiBase64 = captureImage(videoBukti, canvasBukti);
    });

    captureRetur.addEventListener('click', () => {
      returFotoBase64 = captureImage(videoRetur, canvasRetur);
    });

    document.getElementById('ledgerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      document.getElementById('loadingOverlay').classList.remove('hidden');

      try {
        navigator.geolocation.getCurrentPosition(async posGeo => {
          const lat = posGeo.coords.latitude;
          const lng = posGeo.coords.longitude;
          const lokasi = `https://www.google.com/maps?q=${lat},${lng}`;

          const payload = {
            action: 'addTransaksi',
            sheet: 'Transaksi',
            payload: {
              nama, uraian, pos, nominal,
              pembayaran: pembayaranVal,
              fotoNota: fotoNotaBase64,
              fotoBukti: fotoBuktiBase64,
              brightgas, retur,
              returFoto: returFotoBase64,
              lokasi
            }
          };

          const res = await fetch(SUBMIT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });

          const result = await res.json();
          if (result.status === 'success') {
            alert('✅ Transaksi berhasil disimpan!');
            document.getElementById('ledgerForm').reset();
            canvasNota.classList.add('hidden');
            canvasBukti.classList.add('hidden');
            canvasRetur.classList.add('hidden');
          } else {
            alert('❌ Gagal: ' + result.message);
          }
          document.getElementById('loadingOverlay').classList.add('hidden');
        }, err => {
          alert("❌ Gagal mengambil lokasi: " + err.message);
          document.getElementById('loadingOverlay').classList.add('hidden');
        });
      } catch (err) {
        alert('❌ Error koneksi: ' + err.message);
        document.getElementById('loadingOverlay').classList.add('hidden');
      }
    });

    setTimeout(() => localStorage.removeItem('loggedIn'), 300000);
  </script>
</body>
</html>


  <style>
    .loader { border-top-color: #6366f1; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="config.js"></script>
  <script>
    if (localStorage.getItem('loggedIn') !== 'true') window.location.href = 'login.html';

    const API_NAMA = API_ENDPOINT + '?action=nama';
    const API_POS = API_ENDPOINT + '?action=pos';
    const SUBMIT_URL = API_ENDPOINT;

    const namaEl = document.getElementById('nama');
    const uraianEl = document.getElementById('uraian');
    const posEl = document.getElementById('pos');
    const nominalEl = document.getElementById('nominal');
    const brightgasEl = document.getElementById('brightgas');
    const returEl = document.getElementById('retur');
    const returFotoEl = document.getElementById('returFoto');
    const returFotoContainer = document.getElementById('returFotoContainer');
    const previewRetur = document.getElementById('previewRetur');
    const fotoUpload = document.getElementById('fotoNotaUpload');
    const fotoCamera = document.getElementById('fotoNotaCamera');
    const buktiInput = document.getElementById('buktiTransfer');
    const pembayaran = document.getElementById('pembayaran');
    const buktiContainer = document.getElementById('buktiTransferContainer');
    const previewNota = document.getElementById('previewNota');
    const previewBukti = document.getElementById('previewBukti');
    const loadingOverlay = document.getElementById('loadingOverlay');

    fetch(API_NAMA).then(r => r.json()).then(data => {
      data.forEach(n => {
        const o = document.createElement('option');
        o.value = o.textContent = n;
        namaEl.appendChild(o);
      });
    });

    let uraianMap = {};
    fetch(API_POS).then(r => r.json()).then(data => {
      data.forEach(row => {
        uraianMap[row.uraian] = row.pos;
        const o = document.createElement('option');
        o.value = row.uraian;
        document.getElementById('uraianList').appendChild(o);
      });
    });

    uraianEl.addEventListener('input', () => {
      posEl.value = uraianMap[uraianEl.value] || '';
    });
    pembayaran.addEventListener('change', () => {
      buktiContainer.classList.toggle('hidden', pembayaran.value !== 'Ya');
    });
    returEl.addEventListener('input', () => {
      returFotoContainer.classList.toggle('hidden', parseInt(returEl.value) === 0);
    });
    returFotoEl.addEventListener('change', () => {
      previewRetur.src = URL.createObjectURL(returFotoEl.files[0]);
      previewRetur.classList.remove('hidden');
    });
    fotoUpload.addEventListener('change', () => {
      previewNota.src = URL.createObjectURL(fotoUpload.files[0]);
      previewNota.classList.remove('hidden');
    });
    fotoCamera.addEventListener('change', () => {
      previewNota.src = URL.createObjectURL(fotoCamera.files[0]);
      previewNota.classList.remove('hidden');
    });
    buktiInput.addEventListener('change', () => {
      previewBukti.src = URL.createObjectURL(buktiInput.files[0]);
      previewBukti.classList.remove('hidden');
    });

    nominalEl.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = new Intl.NumberFormat('id-ID').format(v);
    });

    document.getElementById('ledgerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      loadingOverlay.classList.remove('hidden');

      const nama = namaEl.value;
      const uraian = uraianEl.value;
      const pos = posEl.value;
      const nominal = nominalEl.value.replace(/\D/g, '');
      const brightgas = parseInt(brightgasEl.value) || 0;
      const retur = parseInt(returEl.value) || 0;
      const pembayaranVal = pembayaran.value;

      const fotoFile = fotoUpload.files[0] || fotoCamera.files[0];
      if (!fotoFile) {
        alert("❌ Foto Pangkalan wajib diunggah.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      const buktiFile = pembayaranVal === "Ya" ? buktiInput.files[0] : null;
      if (pembayaranVal === "Ya" && !buktiFile) {
        alert("❌ Foto Pemilik Pangkalan wajib diunggah.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      if (retur > 0 && !returFotoEl.files[0]) {
        alert("❌ Bukti retur wajib diunggah jika ada retur.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      try {
        const fotoNotaBase64 = await toBase64(fotoFile);
        const fotoBuktiBase64 = buktiFile ? await toBase64(buktiFile) : "";
        const returFotoBase64 = returFotoEl.files[0] ? await toBase64(returFotoEl.files[0]) : "";

        navigator.geolocation.getCurrentPosition(async posGeo => {
          const lat = posGeo.coords.latitude;
          const lng = posGeo.coords.longitude;
          const lokasi = `https://www.google.com/maps?q=${lat},${lng}`;


          const payload = {
            action: 'addTransaksi',
            sheet: 'Transaksi',
            payload: {
              nama, uraian, pos, nominal,
              pembayaran: pembayaranVal,
              fotoNota: fotoNotaBase64,
              fotoBukti: fotoBuktiBase64,
              brightgas, retur, returFoto: returFotoBase64,
              lokasi
            }
          };

          const res = await fetch(SUBMIT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });

          const result = await res.json();
          if (result.status === 'success') {
            alert('✅ Transaksi berhasil disimpan!');
            document.getElementById('ledgerForm').reset();
            previewNota.classList.add('hidden');
            previewBukti.classList.add('hidden');
            previewRetur.classList.add('hidden');
            posEl.value = '';
            buktiContainer.classList.add('hidden');
            returFotoContainer.classList.add('hidden');
          } else {
            alert('❌ Gagal: ' + result.message);
          }
          loadingOverlay.classList.add('hidden');
        });

      } catch (err) {
        alert('❌ Error koneksi: ' + err.message);
        loadingOverlay.classList.add('hidden');
      }
    });
    setTimeout(() => localStorage.removeItem('loggedIn'), 300000);
  </script>
</body>
</html>
