<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i-Shipping SES_GS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader { border-top-color: #6366f1; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    video, canvas, img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 0.5rem;
      border: 1px solid #ddd;
      margin-top: 0.5rem;
      display: block;
    }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-white min-h-screen flex items-center justify-center p-4 relative">

  <div id="loadingOverlay" class="hidden absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-16 w-16"></div>
  </div>

  <a href="dashboard.html" class="absolute top-4 right-4 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow">
    Ke Dashboard
  </a>

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <h2 class="text-3xl font-bold text-indigo-700 mb-6 text-center">i-Shipping SES_GS</h2>
    <form id="ledgerForm" class="space-y-6">
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-600">Driver/Kernet</label>
        <select id="nama" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3"></select>
      </div>
      <div>
        <label for="uraian" class="block text-sm font-medium text-gray-600">Nama Pangkalan</label>
        <input list="uraianList" id="uraian" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" />
        <datalist id="uraianList"></datalist>
      </div>
      <div>
        <label for="pos" class="block text-sm font-medium text-gray-600">Nama PT</label>
        <input type="text" id="pos" readonly class="mt-2 block w-full bg-gray-100 border border-gray-300 rounded-lg p-3" />
      </div>
      <div>
        <label for="nominal" class="block text-sm font-medium text-gray-600">Jumlah Pengiriman</label>
        <input type="text" id="nominal" required class="mt-2 block w-full border border-gray-300 rounded-lg p-3" />
      </div>
      <div>
        <label for="brightgasYN" class="block text-sm font-medium text-gray-600">Apakah Driver Mengirim Bright Gas?</label>
        <select id="brightgasYN" class="mt-2 block w-full border border-gray-300 rounded-lg p-3">
          <option value="Tidak">Tidak</option>
          <option value="Ya">Ya</option>
        </select>
      </div>
      <div id="brightgasContainer" class="hidden space-y-4">
        <div>
          <label for="brightgas12" class="block text-sm font-medium text-gray-600">12 KG</label>
          <input type="number" id="brightgas12" min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
        </div>
        <div>
          <label for="brightgas55" class="block text-sm font-medium text-gray-600">5.5 KG</label>
          <input type="number" id="brightgas55" min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
        </div>
      </div>

      <!-- Foto Pangkalan via Kamera Belakang (Landscape) -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Foto Pangkalan</label>
        <video id="videoNota" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasNota" class="hidden"></canvas>
        <button type="button" id="snapNota" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <img id="previewNota" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <!-- Retur -->
      <div>
        <label for="retur" class="block text-sm font-medium text-gray-600">Retur</label>
        <input type="number" id="retur" required min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
      </div>
      <div id="returFotoContainer" class="hidden">
        <label class="block text-sm font-medium text-gray-600">Foto Retur</label>
        <video id="videoRetur" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasRetur" class="hidden"></canvas>
        <button type="button" id="snapRetur" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <button type="button" id="retakeRetur" class="mt-2 ml-2 bg-red-600 text-white px-4 py-2 rounded-lg hidden">Ambil Ulang</button>
        <img id="previewRetur" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <!-- Bukti Transfer jika Pemilik Ada -->
      <div>
        <label for="pembayaran" class="block text-sm font-medium text-gray-600">Apakah Pemilik Pangkalan berada dilokasi Pangkalan?</label>
        <select id="pembayaran" class="mt-2 block w-full border border-gray-300 rounded-lg p-3">
          <option value="Tidak">Tidak</option>
          <option value="Ya">Ya</option>
        </select>
      </div>
      <div id="buktiTransferContainer" class="hidden">
        <label class="block text-sm font-medium text-gray-600">Foto Pemilik + Pangkalan</label>
        <video id="videoBukti" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasBukti" class="hidden"></canvas>
        <button type="button" id="snapBukti" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <button type="button" id="retakeBukti" class="mt-2 ml-2 bg-red-600 text-white px-4 py-2 rounded-lg hidden">Ambil Ulang</button>
        <img id="previewBukti" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">Submit</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    if (localStorage.getItem('loggedIn') !== 'true') window.location.href = 'login.html';

    const API_NAMA = API_ENDPOINT + '?action=nama';
    const API_POS = API_ENDPOINT + '?action=pos';
    const SUBMIT_URL = API_ENDPOINT;

    const namaEl = document.getElementById('nama');
    const uraianEl = document.getElementById('uraian');
    const posEl = document.getElementById('pos');
    const nominalEl = document.getElementById('nominal');
    const returEl = document.getElementById('retur');

    const returFotoContainer = document.getElementById('returFotoContainer');
    const videoRetur = document.getElementById('videoRetur');
    const canvasRetur = document.getElementById('canvasRetur');
    const snapRetur = document.getElementById('snapRetur');
    const retakeRetur = document.getElementById('retakeRetur');
    const previewRetur = document.getElementById('previewRetur');

    const pembayaran = document.getElementById('pembayaran');
    const buktiTransferContainer = document.getElementById('buktiTransferContainer');
    const videoBukti = document.getElementById('videoBukti');
    const canvasBukti = document.getElementById('canvasBukti');
    const snapBukti = document.getElementById('snapBukti');
    const retakeBukti = document.getElementById('retakeBukti');
    const previewBukti = document.getElementById('previewBukti');

    const brightgasYN = document.getElementById('brightgasYN');
    const brightgasContainer = document.getElementById('brightgasContainer');
    const brightgas12 = document.getElementById('brightgas12');
    const brightgas55 = document.getElementById('brightgas55');

    const videoNota = document.getElementById('videoNota');
    const canvasNota = document.getElementById('canvasNota');
    const snapNota = document.getElementById('snapNota');
    const previewNota = document.getElementById('previewNota');

    const loadingOverlay = document.getElementById('loadingOverlay');

    let streamNota = null;
    let streamRetur = null;
    let streamBukti = null;

    // Start Camera function
    async function startCamera(videoEl) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        videoEl.srcObject = stream;
        return stream;
      } catch (err) {
        alert('Gagal akses kamera: ' + err.message);
        return null;
      }
    }
    // Stop Camera function
    function stopCamera(stream) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    // Load Nama Driver/Kernet
    fetch(API_NAMA).then(r => r.json()).then(data => {
      data.forEach(n => {
        const o = document.createElement('option');
        o.value = o.textContent = n;
        namaEl.appendChild(o);
      });
    });

    // Load uraian dan pos
    let uraianMap = {};
    fetch(API_POS).then(r => r.json()).then(data => {
      data.forEach(row => {
        uraianMap[row.uraian] = row.pos;
        const o = document.createElement('option');
        o.value = row.uraian;
        document.getElementById('uraianList').appendChild(o);
      });
    });

    uraianEl.addEventListener('input', () => {
      posEl.value = uraianMap[uraianEl.value] || '';
    });

    brightgasYN.addEventListener('change', () => {
      brightgasContainer.classList.toggle('hidden', brightgasYN.value !== 'Ya');
    });

    // Toggle Bukti Transfer Container
    pembayaran.addEventListener('change', async () => {
      if (pembayaran.value === 'Ya') {
        buktiTransferContainer.classList.remove('hidden');
        if (!streamBukti) {
          streamBukti = await startCamera(videoBukti);
        }
      } else {
        buktiTransferContainer.classList.add('hidden');
        previewBukti.classList.add('hidden');
        retakeBukti.classList.add('hidden');
        canvasBukti.classList.add('hidden');
        videoBukti.classList.removeAttribute('srcObject');
        stopCamera(streamBukti);
        streamBukti = null;
      }
    });

    // Toggle Retur Foto Container
    returEl.addEventListener('input', async () => {
      if (parseInt(returEl.value) > 0) {
        returFotoContainer.classList.remove('hidden');
        previewRetur.classList.add('hidden');
        retakeRetur.classList.add('hidden');
        canvasRetur.classList.add('hidden');
        videoRetur.classList.removeAttribute('srcObject');
        if (!streamRetur) {
          streamRetur = await startCamera(videoRetur);
        }
      } else {
        returFotoContainer.classList.add('hidden');
        previewRetur.classList.add('hidden');
        retakeRetur.classList.add('hidden');
        canvasRetur.classList.add('hidden');
        videoRetur.classList.removeAttribute('srcObject');
        stopCamera(streamRetur);
        streamRetur = null;
      }
    });

    // Snap Nota
    snapNota.addEventListener('click', () => {
      if (!streamNota) return alert('Kamera Nota belum aktif!');
      const ctx = canvasNota.getContext('2d');
      canvasNota.width = videoNota.videoWidth;
      canvasNota.height = videoNota.videoHeight;
      ctx.drawImage(videoNota, 0, 0, canvasNota.width, canvasNota.height);

      const dataURL = canvasNota.toDataURL('image/jpeg');
      previewNota.src = dataURL;
      previewNota.classList.remove('hidden');

      canvasNota.classList.remove('hidden');
      videoNota.classList.add('hidden');

      stopCamera(streamNota);
      streamNota = null;
      window.fotoNotaBase64 = dataURL.split(',')[1];
    });

    // Start Nota Kamera on page load
    window.addEventListener('load', async () => {
      streamNota = await startCamera(videoNota);
    });

    // Snap Retur
    snapRetur.addEventListener('click', () => {
      if (!streamRetur) return alert('Kamera Retur belum aktif!');
      const ctx = canvasRetur.getContext('2d');
      canvasRetur.width = videoRetur.videoWidth;
      canvasRetur.height = videoRetur.videoHeight;
      ctx.drawImage(videoRetur, 0, 0, canvasRetur.width, canvasRetur.height);

      const dataURL = canvasRetur.toDataURL('image/jpeg');
      previewRetur.src = dataURL;
      previewRetur.classList.remove('hidden');

      canvasRetur.classList.remove('hidden');
      videoRetur.classList.add('hidden');

      snapRetur.classList.add('hidden');
      retakeRetur.classList.remove('hidden');

      stopCamera(streamRetur);
      streamRetur = null;
      window.fotoReturBase64 = dataURL.split(',')[1];
    });

    retakeRetur.addEventListener('click', async () => {
      previewRetur.classList.add('hidden');
      canvasRetur.classList.add('hidden');
      retakeRetur.classList.add('hidden');
      snapRetur.classList.remove('hidden');
      videoRetur.classList.remove('hidden');
      if (!streamRetur) streamRetur = await startCamera(videoRetur);
    });

    // Snap Bukti
    snapBukti.addEventListener('click', () => {
      if (!streamBukti) return alert('Kamera Bukti belum aktif!');
      const ctx = canvasBukti.getContext('2d');
      canvasBukti.width = videoBukti.videoWidth;
      canvasBukti.height = videoBukti.videoHeight;
      ctx.drawImage(videoBukti, 0, 0, canvasBukti.width, canvasBukti.height);

      const dataURL = canvasBukti.toDataURL('image/jpeg');
      previewBukti.src = dataURL;
      previewBukti.classList.remove('hidden');

      canvasBukti.classList.remove('hidden');
      videoBukti.classList.add('hidden');

      snapBukti.classList.add('hidden');
      retakeBukti.classList.remove('hidden');

      stopCamera(streamBukti);
      streamBukti = null;
      window.fotoBuktiBase64 = dataURL.split(',')[1];
    });

    retakeBukti.addEventListener('click', async () => {
      previewBukti.classList.add('hidden');
      canvasBukti.classList.add('hidden');
      retakeBukti.classList.add('hidden');
      snapBukti.classList.remove('hidden');
      videoBukti.classList.remove('hidden');
      if (!streamBukti) streamBukti = await startCamera(videoBukti);
    });

    // Format nominal input as Rupiah style
    nominalEl.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = new Intl.NumberFormat('id-ID').format(v);
    });

    // Submit form
    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      loadingOverlay.classList.remove('hidden');

      const nama = namaEl.value;
      const uraian = uraianEl.value;
      const pos = posEl.value;
      const nominal = nominalEl.value.replace(/\D/g, '');
      const retur = parseInt(returEl.value) || 0;
      const pembayaranVal = pembayaran.value;

      let brightgas = "0";
      if (brightgasYN.value === "Ya") {
        const val12 = parseInt(brightgas12.value) || 0;
        const val55 = parseInt(brightgas55.value) || 0;
        brightgas = `${val12} Tbg (12kg) || ${val55} Tbg (5,5 KG)`;
      }

      // Validasi foto Nota (ambil dari window.fotoNotaBase64)
      if (!window.fotoNotaBase64) {
        alert("❌ Foto Pangkalan wajib diambil menggunakan kamera.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      // Validasi bukti jika Pemilik "Ya"
      if (pembayaranVal === "Ya" && !window.fotoBuktiBase64) {
        alert("❌ Foto Pemilik Pangkalan wajib diambil menggunakan kamera.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      // Validasi retur foto jika retur > 0
      if (retur > 0 && !window.fotoReturBase64) {
        alert("❌ Bukti retur wajib diambil menggunakan kamera.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      // Ambil posisi GPS
      navigator.geolocation.getCurrentPosition(async (posGeo) => {
        const lokasi = `https://www.google.com/maps?q=${posGeo.coords.latitude},${posGeo.coords.longitude}`;

        const payload = {
          action: 'addTransaksi',
          sheet: 'Transaksi',
          payload: {
            nama, uraian, pos, nominal,
            pembayaran: pembayaranVal,
            fotoNota: window.fotoNotaBase64,
            fotoBukti: window.fotoBuktiBase64 || "",
            brightgas, retur, returFoto: window.fotoReturBase64 || "",
            lokasi
          }
        };

        try {
          const res = await fetch(SUBMIT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.status === 'success') {
            alert('✅ Transaksi berhasil disimpan!');
            document.getElementById('ledgerForm').reset();

            previewNota.classList.add('hidden');
            previewBukti.classList.add('hidden');
            previewRetur.classList.add('hidden');
            posEl.value = '';
            buktiTransferContainer.classList.add('hidden');
            returFotoContainer.classList.add('hidden');
            brightgasContainer.classList.add('hidden');

            // Reset foto base64
            window.fotoNotaBase64 = null;
            window.fotoBuktiBase64 = null;
            window.fotoReturBase64 = null;

            // Restart kamera Nota
            if (!streamNota) streamNota = await startCamera(videoNota);
          } else {
            alert('❌ Gagal: ' + result.message);
          }
        } catch (err) {
          alert('❌ Error koneksi: ' + err.message);
        } finally {
          loadingOverlay.classList.add('hidden');
        }
      }, (error) => {
        alert('❌ Gagal mendapatkan lokasi: ' + error.message);
        loadingOverlay.classList.add('hidden');
      });

    });

    setTimeout(() => localStorage.removeItem('loggedIn'), 300000);
  </script>
</body>
</html>
