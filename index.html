<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Kamera Retur dan Bukti</title>
  <style>
    video, canvas, img {
      width: 320px;
      height: 240px;
      border: 1px solid black;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <label for="retur">Retur:</label>
  <input type="number" id="retur" min="0" value="0" />

  <div id="returFotoContainer" class="hidden">
    <video id="videoRetur" autoplay playsinline></video>
    <canvas id="canvasRetur" class="hidden"></canvas>
    <button type="button" id="snapRetur">Ambil Foto Retur</button>
    <button type="button" id="retakeRetur" class="hidden">Ambil Ulang Retur</button>
    <img id="previewRetur" class="hidden" />
  </div>

  <label for="pembayaran">Pemilik Pangkalan ada di lokasi?</label>
  <select id="pembayaran">
    <option value="Tidak">Tidak</option>
    <option value="Ya">Ya</option>
  </select>

  <div id="buktiTransferContainer" class="hidden">
    <video id="videoBukti" autoplay playsinline></video>
    <canvas id="canvasBukti" class="hidden"></canvas>
    <button type="button" id="snapBukti">Ambil Foto Bukti</button>
    <button type="button" id="retakeBukti" class="hidden">Ambil Ulang Bukti</button>
    <img id="previewBukti" class="hidden" />
  </div>

<script>
  const returInput = document.getElementById('retur');
  const returContainer = document.getElementById('returFotoContainer');
  const videoRetur = document.getElementById('videoRetur');
  const canvasRetur = document.getElementById('canvasRetur');
  const snapReturBtn = document.getElementById('snapRetur');
  const retakeReturBtn = document.getElementById('retakeRetur');
  const previewRetur = document.getElementById('previewRetur');

  const pembayaranSelect = document.getElementById('pembayaran');
  const buktiContainer = document.getElementById('buktiTransferContainer');
  const videoBukti = document.getElementById('videoBukti');
  const canvasBukti = document.getElementById('canvasBukti');
  const snapBuktiBtn = document.getElementById('snapBukti');
  const retakeBuktiBtn = document.getElementById('retakeBukti');
  const previewBukti = document.getElementById('previewBukti');

  let streamRetur = null;
  let streamBukti = null;

  // Fungsi start camera
  async function startCamera(videoEl) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      videoEl.srcObject = stream;
      return stream;
    } catch (e) {
      alert('Gagal akses kamera: ' + e.message);
      return null;
    }
  }

  // Fungsi stop camera
  function stopCamera(stream) {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
  }

  // Retur input change
  returInput.addEventListener('input', async () => {
    const val = parseInt(returInput.value) || 0;
    if (val > 0) {
      returContainer.classList.remove('hidden');
      previewRetur.classList.add('hidden');
      canvasRetur.classList.add('hidden');
      retakeReturBtn.classList.add('hidden');
      videoRetur.classList.remove('hidden');

      // start camera for Retur
      if (!streamRetur) streamRetur = await startCamera(videoRetur);
    } else {
      // hide container and stop camera
      returContainer.classList.add('hidden');
      previewRetur.classList.add('hidden');
      retakeReturBtn.classList.add('hidden');
      canvasRetur.classList.add('hidden');
      videoRetur.classList.add('hidden');

      stopCamera(streamRetur);
      streamRetur = null;
    }
  });

  // pembayaran change
  pembayaranSelect.addEventListener('change', async () => {
    if (pembayaranSelect.value === 'Ya') {
      buktiContainer.classList.remove('hidden');
      previewBukti.classList.add('hidden');
      canvasBukti.classList.add('hidden');
      retakeBuktiBtn.classList.add('hidden');
      videoBukti.classList.remove('hidden');

      // start camera for Bukti
      if (!streamBukti) streamBukti = await startCamera(videoBukti);
    } else {
      buktiContainer.classList.add('hidden');
      previewBukti.classList.add('hidden');
      retakeBuktiBtn.classList.add('hidden');
      canvasBukti.classList.add('hidden');
      videoBukti.classList.add('hidden');

      stopCamera(streamBukti);
      streamBukti = null;
    }
  });

  // Take snapshot Retur
  snapReturBtn.addEventListener('click', () => {
    const ctx = canvasRetur.getContext('2d');
    canvasRetur.width = videoRetur.videoWidth;
    canvasRetur.height = videoRetur.videoHeight;
    ctx.drawImage(videoRetur, 0, 0, canvasRetur.width, canvasRetur.height);

    const dataURL = canvasRetur.toDataURL('image/jpeg');
    previewRetur.src = dataURL;
    previewRetur.classList.remove('hidden');

    canvasRetur.classList.remove('hidden');
    videoRetur.classList.add('hidden');
    retakeReturBtn.classList.remove('hidden');

    // stop camera stream for retur
    stopCamera(streamRetur);
    streamRetur = null;

    // Simpan base64 di window
    window.fotoReturBase64 = dataURL.split(',')[1];
  });

  // Retake snapshot Retur
  retakeReturBtn.addEventListener('click', async () => {
    previewRetur.classList.add('hidden');
    canvasRetur.classList.add('hidden');
    retakeReturBtn.classList.add('hidden');
    videoRetur.classList.remove('hidden');

    streamRetur = await startCamera(videoRetur);
  });

  // Take snapshot Bukti
  snapBuktiBtn.addEventListener('click', () => {
    const ctx = canvasBukti.getContext('2d');
    canvasBukti.width = videoBukti.videoWidth;
    canvasBukti.height = videoBukti.videoHeight;
    ctx.drawImage(videoBukti, 0, 0, canvasBukti.width, canvasBukti.height);

    const dataURL = canvasBukti.toDataURL('image/jpeg');
    previewBukti.src = dataURL;
    previewBukti.classList.remove('hidden');

    canvasBukti.classList.remove('hidden');
    videoBukti.classList.add('hidden');
    retakeBuktiBtn.classList.remove('hidden');

    stopCamera(streamBukti);
    streamBukti = null;

    window.fotoBuktiBase64 = dataURL.split(',')[1];
  });

  // Retake snapshot Bukti
  retakeBuktiBtn.addEventListener('click', async () => {
    previewBukti.classList.add('hidden');
    canvasBukti.classList.add('hidden');
    retakeBuktiBtn.classList.add('hidden');
    videoBukti.classList.remove('hidden');

    streamBukti = await startCamera(videoBukti);
  });

</script>
</body>
</html>
