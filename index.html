<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i-Shipping SES_GS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader { border-top-color: #6366f1; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    video { transform: scaleX(-1); }
    canvas { display: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-white min-h-screen flex items-center justify-center p-4 relative">
  <div id="loadingOverlay" class="hidden absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-16 w-16"></div>
  </div>

  <a href="dashboard.html" class="absolute top-4 right-4 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow">
    Ke Dashboard
  </a>

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <h2 class="text-3xl font-bold text-indigo-700 mb-6 text-center">i-Shipping SES_GS</h2>
    <form id="ledgerForm" class="space-y-6">
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-600">Driver/Kernet</label>
        <select id="nama" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3"></select>
      </div>
      <div>
        <label for="uraian" class="block text-sm font-medium text-gray-600">Nama Pangkalan</label>
        <input list="uraianList" id="uraian" required class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" />
        <datalist id="uraianList"></datalist>
      </div>
      <div>
        <label for="pos" class="block text-sm font-medium text-gray-600">Nama PT</label>
        <input type="text" id="pos" readonly class="mt-2 block w-full bg-gray-100 border border-gray-300 rounded-lg p-3" />
      </div>
      <div>
        <label for="nominal" class="block text-sm font-medium text-gray-600">Jumlah Pengiriman</label>
        <input type="text" id="nominal" required class="mt-2 block w-full border border-gray-300 rounded-lg p-3" />
      </div>

      <div>
        <label for="brightgasYN" class="block text-sm font-medium text-gray-600">Apakah Driver Mengirim Bright Gas?</label>
        <select id="brightgasYN" class="mt-2 block w-full border border-gray-300 rounded-lg p-3">
          <option value="Tidak">Tidak</option>
          <option value="Ya">Ya</option>
        </select>
      </div>
      <div id="brightgasContainer" class="hidden space-y-4">
        <div>
          <label for="brightgas12" class="block text-sm font-medium text-gray-600">12 KG</label>
          <input type="number" id="brightgas12" min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
        </div>
        <div>
          <label for="brightgas55" class="block text-sm font-medium text-gray-600">5.5 KG</label>
          <input type="number" id="brightgas55" min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
        </div>
      </div>

      <!-- Kamera Pangkalan -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Foto Pangkalan</label>
        <video id="videoNota" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasNota" class="hidden"></canvas>
        <button type="button" onclick="takeSnapshot('Nota')" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <button type="button" id="retryNota" onclick="retrySnapshot('Nota')" class="mt-2 bg-yellow-500 text-white px-4 py-2 rounded-lg hidden">Ambil Ulang</button>
        <img id="previewNota" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <!-- Retur -->
      <div>
        <label for="retur" class="block text-sm font-medium text-gray-600">Retur</label>
        <input type="number" id="retur" required min="0" class="mt-2 block w-full border border-gray-300 rounded-lg shadow-sm p-3" value="0" />
      </div>
      <div id="returFotoContainer" class="hidden">
        <label class="block text-sm font-medium text-gray-600">Foto Retur</label>
        <video id="videoRetur" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasRetur" class="hidden"></canvas>
        <button type="button" onclick="takeSnapshot('Retur')" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <button type="button" id="retryRetur" onclick="retrySnapshot('Retur')" class="mt-2 bg-yellow-500 text-white px-4 py-2 rounded-lg hidden">Ambil Ulang</button>
        <img id="previewRetur" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <!-- Bukti Pemilik -->
      <div>
        <label for="pembayaran" class="block text-sm font-medium text-gray-600">Apakah Pemilik Pangkalan berada di lokasi?</label>
        <select id="pembayaran" class="mt-2 block w-full border border-gray-300 rounded-lg p-3">
          <option value="Tidak">Tidak</option>
          <option value="Ya">Ya</option>
        </select>
      </div>
      <div id="buktiTransferContainer" class="hidden">
        <label class="block text-sm font-medium text-gray-600">Foto Pemilik + Pangkalan</label>
        <video id="videoBukti" autoplay playsinline class="w-full h-60 object-cover rounded-lg"></video>
        <canvas id="canvasBukti" class="hidden"></canvas>
        <button type="button" onclick="takeSnapshot('Bukti')" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg">Ambil Foto</button>
        <button type="button" id="retryBukti" onclick="retrySnapshot('Bukti')" class="mt-2 bg-yellow-500 text-white px-4 py-2 rounded-lg hidden">Ambil Ulang</button>
        <img id="previewBukti" class="w-full mt-2 hidden rounded-lg border" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">Submit</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="kamera-kanvas.js"></script>
  <script>
    if (localStorage.getItem('loggedIn') !== 'true') window.location.href = 'login.html';

    const API_NAMA = API_ENDPOINT + '?action=nama';
    const API_POS = API_ENDPOINT + '?action=pos';
    const SUBMIT_URL = API_ENDPOINT;

    const namaEl = document.getElementById('nama');
    const uraianEl = document.getElementById('uraian');
    const posEl = document.getElementById('pos');
    const nominalEl = document.getElementById('nominal');
    const returEl = document.getElementById('retur');
    const pembayaran = document.getElementById('pembayaran');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const brightgasYN = document.getElementById('brightgasYN');
    const brightgasContainer = document.getElementById('brightgasContainer');
    const brightgas12 = document.getElementById('brightgas12');
    const brightgas55 = document.getElementById('brightgas55');

    brightgasYN.addEventListener('change', () => {
      brightgasContainer.classList.toggle('hidden', brightgasYN.value !== 'Ya');
    });

    fetch(API_NAMA).then(r => r.json()).then(data => {
      data.forEach(n => {
        const o = document.createElement('option');
        o.value = o.textContent = n;
        namaEl.appendChild(o);
      });
    });

    let uraianMap = {};
    fetch(API_POS).then(r => r.json()).then(data => {
      data.forEach(row => {
        uraianMap[row.uraian] = row.pos;
        const o = document.createElement('option');
        o.value = row.uraian;
        document.getElementById('uraianList').appendChild(o);
      });
    });

    uraianEl.addEventListener('input', () => {
      posEl.value = uraianMap[uraianEl.value] || '';
    });

    nominalEl.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = new Intl.NumberFormat('id-ID').format(v);
    });

    document.getElementById('ledgerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      loadingOverlay.classList.remove('hidden');

      const nama = namaEl.value;
      const uraian = uraianEl.value;
      const pos = posEl.value;
      const nominal = nominalEl.value.replace(/\D/g, '');
      const retur = parseInt(returEl.value) || 0;
      const pembayaranVal = pembayaran.value;

      let brightgas = "0";
      if (brightgasYN.value === "Ya") {
        const val12 = parseInt(brightgas12.value) || 0;
        const val55 = parseInt(brightgas55.value) || 0;
        brightgas = `${val12} Tbg (12kg) || ${val55} Tbg (5,5 KG)`;
      }

      const fotoNotaBase64 = window.fotoNotaBase64;
      const fotoBuktiBase64 = pembayaranVal === "Ya" ? window.fotoBuktiBase64 : "";
      const returFotoBase64 = retur > 0 ? window.fotoReturBase64 : "";

      if (!fotoNotaBase64) {
        alert("❌ Foto Pangkalan wajib diambil.");
        loadingOverlay.classList.add('hidden');
        return;
      }
      if (pembayaranVal === "Ya" && !fotoBuktiBase64) {
        alert("❌ Foto Pemilik wajib diambil.");
        loadingOverlay.classList.add('hidden');
        return;
      }
      if (retur > 0 && !returFotoBase64) {
        alert("❌ Foto Retur wajib diambil.");
        loadingOverlay.classList.add('hidden');
        return;
      }

      navigator.geolocation.getCurrentPosition(async posGeo => {
        const lokasi = `https://www.google.com/maps?q=${posGeo.coords.latitude},${posGeo.coords.longitude}`;
        const payload = {
          action: 'addTransaksi',
          sheet: 'Transaksi',
          payload: {
            nama, uraian, pos, nominal,
            pembayaran: pembayaranVal,
            fotoNota: fotoNotaBase64,
            fotoBukti: fotoBuktiBase64,
            brightgas, retur, returFoto: returFotoBase64,
            lokasi
          }
        };

        const res = await fetch(SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === 'success') {
          alert('✅ Transaksi berhasil disimpan!');
          document.getElementById('ledgerForm').reset();
          posEl.value = '';
          document.querySelectorAll('img').forEach(i => i.classList.add('hidden'));
          document.querySelectorAll('canvas').forEach(c => c.classList.add('hidden'));
        } else {
          alert('❌ Gagal: ' + result.message);
        }
        loadingOverlay.classList.add('hidden');
      }, err => {
        alert("❌ Gagal ambil lokasi: " + err.message);
        loadingOverlay.classList.add('hidden');
      });
    });

    setTimeout(() => localStorage.removeItem('loggedIn'), 300000);
  </script>
</body>
</html>
